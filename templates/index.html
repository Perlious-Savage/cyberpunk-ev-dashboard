<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Charger Security Dashboard</title>
<style>
/* ── Reset & Base ──────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Consolas','Courier New',monospace;
  background:#0a0a15;color:#cdd6f4;
  overflow:hidden;height:100vh;
  display:flex;flex-direction:column;
}

/* ── Scanlines Overlay ─────────────────────────────────────────────────── */
.scanlines{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.03) 0px,rgba(0,0,0,0.03) 1px,transparent 1px,transparent 3px);
  pointer-events:none;z-index:9999;
}

/* ── Header ────────────────────────────────────────────────────────────── */
.dashboard-header{
  background:linear-gradient(90deg,rgba(10,10,21,0.97),rgba(30,30,46,0.97),rgba(10,10,21,0.97));
  border-bottom:1px solid rgba(137,180,250,0.3);
  padding:8px 20px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 0 30px rgba(137,180,250,0.1);z-index:10;
}
.header-title{
  font-size:16px;font-weight:bold;color:#89b4fa;
  text-shadow:0 0 15px rgba(137,180,250,0.6);letter-spacing:3px;
}
.header-status{display:flex;align-items:center;gap:14px;}
.status-badge{
  padding:4px 12px;border-radius:4px;font-size:11px;font-weight:bold;letter-spacing:1px;
}
.status-normal{background:rgba(166,227,161,0.15);color:#a6e3a1;border:1px solid rgba(166,227,161,0.3);}
.status-attack{
  background:rgba(243,139,168,0.2);color:#f38ba8;border:1px solid rgba(243,139,168,0.5);
  animation:statusPulse 1s ease-in-out infinite;
}
@keyframes statusPulse{
  0%,100%{box-shadow:0 0 5px rgba(243,139,168,0.3);}
  50%{box-shadow:0 0 20px rgba(243,139,168,0.7);}
}
.mode-badge{
  padding:4px 10px;border-radius:4px;font-size:10px;font-weight:bold;letter-spacing:1px;
  background:rgba(249,226,175,0.15);color:#f9e2af;border:1px solid rgba(249,226,175,0.3);
}
.clock{color:#6c7086;font-size:12px;letter-spacing:1px;}

/* ── Alert Banner ──────────────────────────────────────────────────────── */
.alert-banner{
  display:none;
  background:linear-gradient(90deg,#1e1e2e,#3b0000,#1e1e2e);
  border-bottom:2px solid #f38ba8;padding:10px 20px;
  text-align:center;font-size:15px;font-weight:bold;color:#f38ba8;
  text-shadow:0 0 15px rgba(243,139,168,0.8);
  animation:alertPulse 1s ease-in-out infinite;z-index:10;
}
.alert-banner.active{display:block;}
@keyframes alertPulse{
  0%,100%{border-color:#f38ba8;box-shadow:0 0 20px rgba(243,139,168,0.2);}
  50%{border-color:#ff0000;box-shadow:0 0 50px rgba(255,0,0,0.5);}
}

/* ── Main Content ──────────────────────────────────────────────────────── */
.main-content{display:flex;flex:1;min-height:0;overflow:hidden;}

/* ── 3D Scene ──────────────────────────────────────────────────────────── */
.three-container{flex:3;position:relative;overflow:hidden;background:#0a0a15;}
.three-container canvas{display:block;}

/* ── Right Panel ───────────────────────────────────────────────────────── */
.right-panel{
  flex:2;display:flex;flex-direction:column;gap:8px;padding:8px;
  max-width:400px;min-width:300px;z-index:5;
}

/* ── Fleet Table ───────────────────────────────────────────────────────── */
.fleet-panel{
  background:rgba(30,30,46,0.8);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(137,180,250,0.25);border-radius:12px;
  padding:12px 14px;
  box-shadow:0 0 30px rgba(137,180,250,0.08),inset 0 0 40px rgba(137,180,250,0.03);
  flex:1;overflow-y:auto;
}
.fleet-title{font-size:13px;font-weight:bold;color:#89b4fa;margin-bottom:8px;letter-spacing:2px;}
.fleet-table{width:100%;border-collapse:collapse;}
.fleet-table th{
  color:#6c7086;font-size:10px;text-align:left;padding:5px 8px;
  border-bottom:1px solid rgba(69,71,90,0.5);letter-spacing:1px;text-transform:uppercase;
}
.fleet-table td{padding:5px 8px;font-size:13px;border-bottom:1px solid rgba(69,71,90,0.15);}
.fleet-row{transition:background 0.3s;}
.fleet-row:hover{background:rgba(137,180,250,0.05);}
.fleet-row.row-alert{animation:rowFlash 0.5s ease-in-out 3;}
@keyframes rowFlash{0%,100%{background:transparent;}50%{background:rgba(243,139,168,0.15);}}
.node-id{color:#cdd6f4;font-weight:bold;}
.trust-green{color:#a6e3a1;font-weight:bold;}
.trust-yellow{color:#f9e2af;font-weight:bold;}
.trust-red{color:#f38ba8;font-weight:bold;}
.state-badge{font-weight:bold;font-size:11px;letter-spacing:0.5px;}
.badge-green{color:#a6e3a1;text-shadow:0 0 8px rgba(166,227,161,0.4);}
.badge-yellow{color:#f9e2af;text-shadow:0 0 8px rgba(249,226,175,0.4);}
.badge-red{color:#f38ba8;text-shadow:0 0 8px rgba(243,139,168,0.5);font-weight:900;}
.kw-value{color:#f9e2af;font-weight:bold;}

/* ── Gauge Panel ───────────────────────────────────────────────────────── */
.gauge-panel{
  background:rgba(30,30,46,0.8);backdrop-filter:blur(16px);
  border:1px solid rgba(137,180,250,0.25);border-radius:12px;
  padding:8px;text-align:center;
  box-shadow:0 0 30px rgba(137,180,250,0.08);
}
.gauge-title{font-size:11px;color:#6c7086;letter-spacing:2px;margin-bottom:2px;}
#gauge-canvas{width:100%;max-height:170px;}

/* ── Red Team Panel ────────────────────────────────────────────────────── */
.redteam-panel{
  background:rgba(20,20,35,0.95);
  border-top:1px solid rgba(243,139,168,0.3);border-bottom:1px solid rgba(243,139,168,0.3);
  padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:0 0 25px rgba(243,139,168,0.08);z-index:10;
}
.redteam-title{
  font-size:12px;font-weight:bold;color:#f38ba8;letter-spacing:2px;
  text-shadow:0 0 10px rgba(243,139,168,0.5);white-space:nowrap;
}
.target-select{
  background:rgba(49,50,68,0.9);color:#cdd6f4;
  border:1px solid rgba(137,180,250,0.3);padding:7px 12px;
  border-radius:6px;font-family:inherit;font-size:12px;outline:none;
  cursor:pointer;
}
.target-select:focus{border-color:#89b4fa;box-shadow:0 0 10px rgba(137,180,250,0.3);}
.btn-attack{
  padding:7px 14px;border:1px solid;border-radius:6px;
  font-family:inherit;font-size:11px;font-weight:bold;
  cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;
}
.btn-tamper-on{
  background:linear-gradient(135deg,#3a0000,#6b0000);border-color:#f38ba8;color:#f38ba8;
  box-shadow:0 0 12px rgba(243,139,168,0.25);
}
.btn-tamper-on:hover{box-shadow:0 0 25px rgba(243,139,168,0.6);transform:scale(1.05);}
.btn-tamper-off{background:rgba(49,50,68,0.8);border-color:#a6e3a1;color:#a6e3a1;}
.btn-tamper-off:hover{box-shadow:0 0 15px rgba(166,227,161,0.3);transform:scale(1.05);}
.btn-usb-on{
  background:linear-gradient(135deg,#2a1500,#5a2000);border-color:#fab387;color:#fab387;
  box-shadow:0 0 12px rgba(250,179,135,0.25);
}
.btn-usb-on:hover{box-shadow:0 0 25px rgba(250,179,135,0.6);transform:scale(1.05);}
.btn-usb-off{background:rgba(49,50,68,0.8);border-color:#a6e3a1;color:#a6e3a1;}
.btn-usb-off:hover{box-shadow:0 0 15px rgba(166,227,161,0.3);transform:scale(1.05);}

/* ── Event Log ─────────────────────────────────────────────────────────── */
.event-log{
  background:rgba(0,0,0,0.9);border-top:1px solid rgba(166,227,161,0.2);
  padding:6px 15px;height:120px;overflow-y:auto;z-index:10;
}
.log-header{
  font-size:10px;color:#6c7086;letter-spacing:2px;margin-bottom:4px;
  border-bottom:1px solid rgba(69,71,90,0.3);padding-bottom:3px;
}
.log-entry{
  font-size:11px;line-height:1.5;color:#a6e3a1;
  text-shadow:0 0 4px rgba(166,227,161,0.25);
}
.log-time{color:#6c7086;}

/* ── 3D Labels (CSS2DRenderer) ─────────────────────────────────────────── */
.charger-label{
  color:#cdd6f4;font-family:'Consolas',monospace;font-size:10px;font-weight:bold;
  text-shadow:0 0 8px rgba(137,180,250,0.8);
  padding:2px 6px;background:rgba(10,10,21,0.7);
  border:1px solid rgba(137,180,250,0.35);border-radius:3px;
  letter-spacing:1px;pointer-events:none;white-space:nowrap;
}
.charger-label.label-throttled{
  border-color:rgba(249,226,175,0.5);text-shadow:0 0 8px rgba(249,226,175,0.8);color:#f9e2af;
}
.charger-label.label-isolated{
  border-color:rgba(243,139,168,0.6);text-shadow:0 0 10px rgba(243,139,168,0.9);color:#f38ba8;
  animation:labelBlink 0.5s ease-in-out infinite;
}
@keyframes labelBlink{0%,100%{opacity:1;}50%{opacity:0.5;}}

/* ── Distance Readout ──────────────────────────────────────────────────── */
.distance-badge{
  position:absolute;bottom:10px;left:10px;z-index:10;
  background:rgba(30,30,46,0.8);border:1px solid rgba(137,180,250,0.3);
  border-radius:6px;padding:5px 10px;font-size:10px;color:#6c7086;
  backdrop-filter:blur(8px);
}
.distance-badge .dist-val{color:#89b4fa;font-weight:bold;}

/* ── Scrollbar ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);}
::-webkit-scrollbar-thumb{background:rgba(137,180,250,0.3);border-radius:2px;}
</style>
</head>
<body>

<div class="scanlines"></div>

<!-- ═══ Header ═══ -->
<header class="dashboard-header">
  <div class="header-title">⚡ EV CHARGER SECURITY DASHBOARD</div>
  <div class="header-status">
    <span id="grid-status" class="status-badge status-normal">GRID: NORMAL</span>
    <span id="mode-badge" class="mode-badge">SIM MODE</span>
    <span id="clock" class="clock">--:--:--</span>
  </div>
</header>

<!-- ═══ Alert Banner ═══ -->
<div id="alert-banner" class="alert-banner">
  <span id="alert-text">⚠ THREAT DETECTED</span>
</div>

<!-- ═══ Main Content ═══ -->
<div class="main-content">
  <!-- 3D Scene -->
  <div id="three-container" class="three-container">
    <div class="distance-badge">
      SENSOR: <span id="dist-val" class="dist-val">--</span> cm
      &nbsp;|&nbsp; DOOR: <span id="door-state" class="dist-val">--</span>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <!-- Fleet Table -->
    <div class="fleet-panel">
      <div class="fleet-title">FLEET STATUS</div>
      <table class="fleet-table">
        <thead><tr><th>NODE</th><th>TRUST</th><th>STATE</th><th>KW</th></tr></thead>
        <tbody id="fleet-tbody"></tbody>
      </table>
    </div>
    <!-- Power Gauge -->
    <div class="gauge-panel">
      <div class="gauge-title">REAL-TIME POWER METER</div>
      <canvas id="gauge-canvas" width="380" height="190"></canvas>
    </div>
  </div>
</div>

<!-- ═══ Red Team Panel ═══ -->
<div class="redteam-panel">
  <div class="redteam-title">RED TEAM INJECTION</div>
  <select id="target-select" class="target-select">
    <option>EVSE-01</option><option>EVSE-02</option><option>EVSE-03</option><option>EVSE-04</option>
    <option>EVSE-05</option><option>EVSE-06</option><option>EVSE-07</option><option>EVSE-08</option>
  </select>
  <button onclick="window._attack('tamper')" class="btn-attack btn-tamper-on">🔒 Tamper ON</button>
  <button onclick="window._restore('tamper')" class="btn-attack btn-tamper-off">🔓 Tamper OFF</button>
  <button onclick="window._attack('usb')" class="btn-attack btn-usb-on">💻 USB ON</button>
  <button onclick="window._restore('usb')" class="btn-attack btn-usb-off">✓ USB OFF</button>
</div>

<!-- ═══ Event Log ═══ -->
<div class="event-log">
  <div class="log-header">EVENT LOG</div>
  <div id="event-log-content"></div>
</div>

<!-- ═══ Three.js (ES Module via importmap) ═══ -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ══════════════════════════════════════════════════════════════════════════════
//  GLOBALS
// ══════════════════════════════════════════════════════════════════════════════

const COLORS = {
  FULL_TRUST: { main: 0xa6e3a1, emissive: 0xa6e3a1, platform: 0x89b4fa },
  THROTTLED:  { main: 0xf9e2af, emissive: 0xf9e2af, platform: 0xfab387 },
  ISOLATED:   { main: 0xf38ba8, emissive: 0xf38ba8, platform: 0xf38ba8 },
};

let scene, camera, renderer, labelRenderer, controls, clock;
let chargerObjects = [];     // Array of charger 3D data
let currentStates = [];      // Array of state strings per charger
let particlePositions;       // Float32Array for particle animation
let particleGeo;
let lastEventCount = 0;
let gaugeNeedle = 0;         // Smoothed gauge value

// Charger grid positions: 2 rows of 4
const POSITIONS = [
  [-4.5, 0, -2], [-1.5, 0, -2], [1.5, 0, -2], [4.5, 0, -2],
  [-4.5, 0,  2], [-1.5, 0,  2], [1.5, 0,  2], [4.5, 0,  2],
];
const CHARGER_IDS = [
  'EVSE-01','EVSE-02','EVSE-03','EVSE-04',
  'EVSE-05','EVSE-06','EVSE-07','EVSE-08',
];

// ══════════════════════════════════════════════════════════════════════════════
//  THREE.JS SCENE SETUP
// ══════════════════════════════════════════════════════════════════════════════

function initScene() {
  const container = document.getElementById('three-container');
  const w = container.clientWidth;
  const h = container.clientHeight;

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080812);
  scene.fog = new THREE.FogExp2(0x080812, 0.035);

  // Camera
  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 200);
  camera.position.set(11, 9, 11);
  camera.lookAt(0, 0, 0);

  // WebGL Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  container.appendChild(renderer.domElement);

  // CSS2D Renderer for labels
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(w, h);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  container.appendChild(labelRenderer.domElement);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;
  controls.maxPolarAngle = Math.PI / 2.15;
  controls.minDistance = 6;
  controls.maxDistance = 25;
  controls.target.set(0, 0.5, 0);

  // Clock
  clock = new THREE.Clock();

  // Lights
  addLights();

  // Ground + Grid
  addGround();

  // Chargers
  for (let i = 0; i < 8; i++) {
    const obj = createCharger(CHARGER_IDS[i], POSITIONS[i][0], POSITIONS[i][2]);
    scene.add(obj.group);
    chargerObjects.push(obj);
    currentStates.push('FULL_TRUST');
  }

  // Particles
  addParticles();

  // Resize handler
  new ResizeObserver(() => {
    const nw = container.clientWidth;
    const nh = container.clientHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
    labelRenderer.setSize(nw, nh);
  }).observe(container);
}

// ── Lights ────────────────────────────────────────────────────────────────

function addLights() {
  // Ambient
  scene.add(new THREE.AmbientLight(0x303050, 0.6));

  // Main directional
  const dir = new THREE.DirectionalLight(0xeeeeff, 0.7);
  dir.position.set(8, 12, 8);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024, 1024);
  dir.shadow.camera.near = 1;
  dir.shadow.camera.far = 30;
  dir.shadow.camera.left = -10;
  dir.shadow.camera.right = 10;
  dir.shadow.camera.top = 10;
  dir.shadow.camera.bottom = -10;
  scene.add(dir);

  // Rim light (blue)
  const rim = new THREE.DirectionalLight(0x4477ff, 0.3);
  rim.position.set(-5, 8, -5);
  scene.add(rim);
}

// ── Ground ────────────────────────────────────────────────────────────────

function addGround() {
  // Dark reflective ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x0a0a18, metalness: 0.85, roughness: 0.35 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Outer grid
  const grid1 = new THREE.GridHelper(40, 40, 0x151530, 0x151530);
  grid1.position.y = 0.01;
  scene.add(grid1);

  // Inner brighter grid
  const grid2 = new THREE.GridHelper(14, 14, 0x252555, 0x1c1c44);
  grid2.position.y = 0.02;
  scene.add(grid2);

  // Neon border rectangle on the ground
  const borderGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-6.5, 0.03, -3.5),
    new THREE.Vector3( 6.5, 0.03, -3.5),
    new THREE.Vector3( 6.5, 0.03,  3.5),
    new THREE.Vector3(-6.5, 0.03,  3.5),
    new THREE.Vector3(-6.5, 0.03, -3.5),
  ]);
  const borderMat = new THREE.LineBasicMaterial({ color: 0x89b4fa, transparent: true, opacity: 0.4 });
  scene.add(new THREE.Line(borderGeo, borderMat));
}

// ── Charger Model ─────────────────────────────────────────────────────────

function createCharger(id, x, z) {
  const group = new THREE.Group();

  // Platform (circle base)
  const platGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.06, 32);
  const platMat = new THREE.MeshStandardMaterial({
    color: 0x1e1e2e, emissive: 0x89b4fa, emissiveIntensity: 0.35,
    metalness: 0.7, roughness: 0.3,
  });
  const platform = new THREE.Mesh(platGeo, platMat);
  platform.position.y = 0.03;
  platform.receiveShadow = true;
  group.add(platform);

  // Main body (tall pillar)
  const bodyGeo = new THREE.BoxGeometry(0.5, 1.5, 0.35);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xa6e3a1, emissive: 0xa6e3a1, emissiveIntensity: 0.12,
    metalness: 0.25, roughness: 0.55,
    transparent: true, opacity: 0.88,
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.81;
  body.castShadow = true;
  group.add(body);

  // Wireframe edges
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xa6e3a1, transparent: true, opacity: 0.7 });
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(bodyGeo), edgeMat);
  edges.position.copy(body.position);
  group.add(edges);

  // Screen (small display on top-front)
  const scrGeo = new THREE.BoxGeometry(0.32, 0.2, 0.04);
  const scrMat = new THREE.MeshStandardMaterial({
    color: 0x89b4fa, emissive: 0x89b4fa, emissiveIntensity: 0.6,
    metalness: 0.5, roughness: 0.2,
  });
  const screen = new THREE.Mesh(scrGeo, scrMat);
  screen.position.set(0, 1.3, 0.2);
  group.add(screen);

  // Top cap
  const capGeo = new THREE.BoxGeometry(0.54, 0.06, 0.39);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x45475a, metalness: 0.6, roughness: 0.4 });
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.y = 1.59;
  group.add(cap);

  // Point light per charger
  const pLight = new THREE.PointLight(0xa6e3a1, 0.6, 4);
  pLight.position.set(0, 1.2, 0.3);
  group.add(pLight);

  // CSS2D Label
  const labelDiv = document.createElement('div');
  labelDiv.className = 'charger-label';
  labelDiv.textContent = id;
  const label = new CSS2DObject(labelDiv);
  label.position.set(0, 2.0, 0);
  group.add(label);

  group.position.set(x, 0, z);

  return { group, body, bodyMat, edges, edgeMat, platform, platMat, pLight, screen, scrMat, label, labelDiv, id, baseX: x, baseZ: z };
}

// ── Particles ─────────────────────────────────────────────────────────────

function addParticles() {
  const count = 250;
  particleGeo = new THREE.BufferGeometry();
  particlePositions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    particlePositions[i * 3]     = (Math.random() - 0.5) * 35;
    particlePositions[i * 3 + 1] = Math.random() * 12;
    particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 35;
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  const pMat = new THREE.PointsMaterial({
    color: 0x89b4fa, size: 0.04, transparent: true, opacity: 0.35,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  scene.add(new THREE.Points(particleGeo, pMat));
}

// ══════════════════════════════════════════════════════════════════════════════
//  UPDATE CHARGER VISUALS
// ══════════════════════════════════════════════════════════════════════════════

function updateChargerVisual(obj, state) {
  const c = COLORS[state] || COLORS.FULL_TRUST;

  obj.bodyMat.color.setHex(c.main);
  obj.bodyMat.emissive.setHex(c.emissive);
  obj.bodyMat.emissiveIntensity = state === 'ISOLATED' ? 0.35 : 0.12;
  obj.bodyMat.opacity = state === 'ISOLATED' ? 0.65 : 0.88;

  obj.edgeMat.color.setHex(c.main);
  obj.edgeMat.opacity = state === 'ISOLATED' ? 1.0 : 0.7;

  obj.platMat.emissive.setHex(c.platform);
  obj.platMat.emissiveIntensity = state === 'ISOLATED' ? 0.7 : 0.35;

  obj.pLight.color.setHex(c.main);
  obj.pLight.intensity = state === 'ISOLATED' ? 1.5 : 0.6;
  obj.pLight.distance = state === 'ISOLATED' ? 6 : 4;

  // Label styling
  obj.labelDiv.className = 'charger-label' +
    (state === 'THROTTLED' ? ' label-throttled' : '') +
    (state === 'ISOLATED' ? ' label-isolated' : '');
}

// ══════════════════════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ══════════════════════════════════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Animate chargers based on state
  chargerObjects.forEach((obj, i) => {
    const state = currentStates[i];

    if (state === 'FULL_TRUST') {
      // Gentle bob
      obj.group.position.y = Math.sin(t * 1.2 + i * 0.7) * 0.025;
      obj.group.rotation.z = 0;
      obj.group.position.x = obj.baseX;
      obj.group.position.z = obj.baseZ;
    } else if (state === 'THROTTLED') {
      // Wobble
      obj.group.rotation.z = Math.sin(t * 2.5 + i) * 0.025;
      obj.group.position.y = Math.sin(t * 1.8 + i * 0.5) * 0.018;
      obj.group.position.x = obj.baseX;
      obj.group.position.z = obj.baseZ;
    } else if (state === 'ISOLATED') {
      // Violent shake
      obj.group.position.x = obj.baseX + (Math.random() - 0.5) * 0.07;
      obj.group.position.z = obj.baseZ + (Math.random() - 0.5) * 0.07;
      obj.group.position.y = Math.sin(t * 6) * 0.04;
      obj.group.rotation.z = (Math.random() - 0.5) * 0.04;
      // Pulse emissive
      obj.bodyMat.emissiveIntensity = 0.25 + Math.sin(t * 10) * 0.2;
      obj.platMat.emissiveIntensity = 0.5 + Math.sin(t * 8 + 1) * 0.3;
    }
  });

  // Animate particles (drift upward)
  for (let i = 0; i < particlePositions.length; i += 3) {
    particlePositions[i + 1] += 0.004;
    particlePositions[i] += Math.sin(t + i) * 0.001;
    if (particlePositions[i + 1] > 12) {
      particlePositions[i + 1] = 0;
      particlePositions[i] = (Math.random() - 0.5) * 35;
      particlePositions[i + 2] = (Math.random() - 0.5) * 35;
    }
  }
  particleGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// ══════════════════════════════════════════════════════════════════════════════
//  POWER GAUGE (Canvas 2D)
// ══════════════════════════════════════════════════════════════════════════════

function drawGauge(totalKW) {
  const canvas = document.getElementById('gauge-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H * 0.72;
  const r = Math.min(W, H) * 0.40;
  const maxKW = 160;

  // Smooth needle
  gaugeNeedle += (totalKW - gaugeNeedle) * 0.12;

  ctx.clearRect(0, 0, W, H);

  const startA = Math.PI * 0.8;
  const endA = Math.PI * 2.2;
  const sweep = endA - startA;

  // Background arc track
  ctx.beginPath();
  ctx.arc(cx, cy, r, startA, endA);
  ctx.lineWidth = 14;
  ctx.strokeStyle = 'rgba(69,71,90,0.3)';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Gradient segments: green → yellow → red
  const segments = [
    { end: 0.6, color: '#a6e3a1' },
    { end: 0.8, color: '#f9e2af' },
    { end: 1.0, color: '#f38ba8' },
  ];
  const pct = Math.min(gaugeNeedle / maxKW, 1);
  let prevEnd = 0;
  for (const seg of segments) {
    const segPct = Math.min(pct, seg.end);
    if (segPct <= prevEnd) break;
    ctx.beginPath();
    ctx.arc(cx, cy, r, startA + sweep * prevEnd, startA + sweep * segPct);
    ctx.lineWidth = 14;
    ctx.strokeStyle = seg.color;
    ctx.lineCap = 'round';
    ctx.shadowColor = seg.color;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;
    prevEnd = segPct;
  }

  // Threshold markers
  [0.6, 0.8].forEach(th => {
    const a = startA + sweep * th;
    const ix = cx + Math.cos(a) * (r - 12);
    const iy = cy + Math.sin(a) * (r - 12);
    const ox = cx + Math.cos(a) * (r + 12);
    const oy = cy + Math.sin(a) * (r + 12);
    ctx.beginPath();
    ctx.moveTo(ix, iy);
    ctx.lineTo(ox, oy);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(108,112,134,0.5)';
    ctx.stroke();
  });

  // Needle
  const needleAngle = startA + sweep * pct;
  const nx = cx + Math.cos(needleAngle) * (r - 20);
  const ny = cy + Math.sin(needleAngle) * (r - 20);
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(nx, ny);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#cdd6f4';
  ctx.shadowColor = '#cdd6f4';
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#89b4fa';
  ctx.shadowColor = '#89b4fa';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Digital readout
  const valColor = pct < 0.6 ? '#a6e3a1' : pct < 0.8 ? '#f9e2af' : '#f38ba8';
  ctx.font = 'bold 26px Consolas';
  ctx.fillStyle = valColor;
  ctx.textAlign = 'center';
  ctx.shadowColor = valColor;
  ctx.shadowBlur = 10;
  ctx.fillText(`${gaugeNeedle.toFixed(1)} KW`, cx, cy - 18);
  ctx.shadowBlur = 0;

  // Label
  ctx.font = '10px Consolas';
  ctx.fillStyle = '#6c7086';
  ctx.fillText('TOTAL GRID LOAD', cx, cy - 2);

  // Zone labels
  ctx.font = '9px Consolas';
  const labelR = r + 22;
  // Green zone
  let la = startA + sweep * 0.15;
  ctx.fillStyle = 'rgba(166,227,161,0.4)';
  ctx.fillText('SAFE', cx + Math.cos(la) * labelR, cy + Math.sin(la) * labelR);
  // Yellow zone
  la = startA + sweep * 0.7;
  ctx.fillStyle = 'rgba(249,226,175,0.4)';
  ctx.fillText('WARN', cx + Math.cos(la) * labelR, cy + Math.sin(la) * labelR);
  // Red zone
  la = startA + sweep * 0.92;
  ctx.fillStyle = 'rgba(243,139,168,0.4)';
  ctx.fillText('CRIT', cx + Math.cos(la) * labelR, cy + Math.sin(la) * labelR);
}

// ══════════════════════════════════════════════════════════════════════════════
//  UI UPDATES (Fleet Table, Alerts, Log, Header)
// ══════════════════════════════════════════════════════════════════════════════

function updateFleetTable(chargers) {
  const tbody = document.getElementById('fleet-tbody');
  const rows = [];
  chargers.forEach(c => {
    const sc = c.state === 'FULL_TRUST' ? 'green' : c.state === 'THROTTLED' ? 'yellow' : 'red';
    rows.push(`<tr class="fleet-row${c.state !== 'FULL_TRUST' ? ' row-alert' : ''}">
      <td class="node-id">${c.id}</td>
      <td><span class="trust-${sc}">${c.trust}</span></td>
      <td><span class="state-badge badge-${sc}">${c.state}</span></td>
      <td class="kw-value">${c.kw.toFixed(1)}</td>
    </tr>`);
  });
  tbody.innerHTML = rows.join('');
}

function updateAlertBanner(chargers) {
  const banner = document.getElementById('alert-banner');
  const gridBadge = document.getElementById('grid-status');
  const threats = chargers.filter(c => c.state !== 'FULL_TRUST');

  if (threats.length === 0) {
    banner.classList.remove('active');
    gridBadge.textContent = 'GRID: NORMAL';
    gridBadge.className = 'status-badge status-normal';
    return;
  }

  banner.classList.add('active');
  gridBadge.textContent = 'GRID: UNDER ATTACK';
  gridBadge.className = 'status-badge status-attack';

  const iso = threats.filter(t => t.state === 'ISOLATED').length;
  const thr = threats.filter(t => t.state === 'THROTTLED').length;
  let msg = '⚠ THREAT DETECTED — ';
  if (iso) msg += `${iso} ISOLATED`;
  if (iso && thr) msg += ' | ';
  if (thr) msg += `${thr} THROTTLED`;
  document.getElementById('alert-text').textContent = msg;
}

function updateEventLog(events) {
  if (events.length === lastEventCount) return;
  lastEventCount = events.length;
  const el = document.getElementById('event-log-content');
  el.innerHTML = events.map(e =>
    `<div class="log-entry"><span class="log-time">[${e.time}]</span> ${e.msg}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-GB', { hour12: false });
}

function updateSensorDisplay(data) {
  const distEl = document.getElementById('dist-val');
  const doorEl = document.getElementById('door-state');
  if (data.serial_connected && data.distance >= 0) {
    distEl.textContent = data.distance.toFixed(1);
    const evse1 = data.chargers[0];
    doorEl.textContent = evse1.door_open ? 'OPEN' : 'CLOSED';
    doorEl.style.color = evse1.door_open ? '#f38ba8' : '#a6e3a1';
  } else {
    distEl.textContent = '--';
    doorEl.textContent = 'N/A';
  }
  document.getElementById('mode-badge').textContent =
    data.serial_connected ? 'LIVE MODE' : 'SIM MODE';
}

// ══════════════════════════════════════════════════════════════════════════════
//  API POLLING
// ══════════════════════════════════════════════════════════════════════════════

async function fetchState() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();

    // Update 3D chargers
    data.chargers.forEach((c, i) => {
      if (chargerObjects[i] && currentStates[i] !== c.state) {
        updateChargerVisual(chargerObjects[i], c.state);
        currentStates[i] = c.state;
      }
    });

    // Update UI panels
    updateFleetTable(data.chargers);
    updateAlertBanner(data.chargers);
    updateEventLog(data.events);
    updateSensorDisplay(data);

    // Update gauge
    const totalKW = data.chargers.reduce((s, c) => s + c.kw, 0);
    drawGauge(totalKW);

  } catch (e) {
    // API unreachable - ignore silently
  }
}

// ══════════════════════════════════════════════════════════════════════════════
//  RED TEAM CONTROLS (exposed to onclick)
// ══════════════════════════════════════════════════════════════════════════════

window._attack = async function(type) {
  const id = document.getElementById('target-select').value;
  await fetch('/api/attack', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, type }),
  });
};

window._restore = async function(type) {
  const id = document.getElementById('target-select').value;
  await fetch('/api/restore', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, type }),
  });
};

// ══════════════════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════════════════

initScene();
animate();
fetchState();
setInterval(fetchState, 500);
setInterval(updateClock, 1000);
updateClock();

</script>
